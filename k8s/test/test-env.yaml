# Disposable test namespace: everything the dev namespace has, minus the
# blockers that stop a full tool run (see docs/superpowers/plans/
# test-cluster-and-workflow-improvements.md): permissive in-namespace RBAC,
# per-command approval pause off, mock PagerDuty/Slack/Cost Explorer, an
# always-firing alert, and deliberately broken/scalable fixtures.
# Namespace-scoped only — no ClusterRole, nothing that can touch `opssquad`.
# Secrets + the mocks/sql ConfigMaps are created by scripts/test-env.sh.
apiVersion: v1
kind: Namespace
metadata: { name: opssquad-test, labels: { opssquad/disposable: "true" } }
---
# Caps a runaway `scale` so it cannot starve the dev namespace on the shared nodes.
apiVersion: v1
kind: ResourceQuota
metadata: { name: pod-cap, namespace: opssquad-test }
spec: { hard: { pods: "30" } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: opssquad-config, namespace: opssquad-test }
data:
  NODE_ENV: "production"
  POSTGRES_USER: "opssquad"
  POSTGRES_DB: "opssquad"
  REDIS_URL: "redis://redis:6379"
  BFF_PORT: "4000"
  RUNTIME_URL: "http://runtime:8000"
  FRONTEND_ORIGIN: "http://localhost:5173"
  MUTATING_AGENTS_ENABLED: "true"
  REAL_TOOLS_ENABLED: "true"
  LOCAL_LLM_BASE_URL: "http://172.18.0.1:8080/v1"
  LOCAL_LLM_READ_TIMEOUT: "300"  # a slow local model (thinking) can exceed the 120s default
  MODEL_CONTROL_URL: "http://172.18.0.1:8081"
  # --- test-only switches (runtime refuses APPROVAL_MODE=auto anywhere else) ---
  ENVIRONMENT: "test"
  APPROVAL_MODE: "auto"
  KUBE_NAMESPACE: "opssquad-test"
  ARGOCD_APP: "argocd-test"
  PAGERDUTY_API_URL: "http://mocks:8080/pagerduty"
  PAGERDUTY_API_TOKEN: "test-token"
  SLACK_WEBHOOK_URL: "http://mocks:8080/slack/webhook"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_ENDPOINT_URL_COST_EXPLORER: "http://mocks:8080"
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: runtime, namespace: opssquad-test }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: bff, namespace: opssquad-test }
---
# Full control of this namespace only (delete, patch, create, exec, helm state).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: runtime-agent, namespace: opssquad-test }
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io", "autoscaling"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: runtime-agent, namespace: opssquad-test }
subjects: [{ kind: ServiceAccount, name: runtime, namespace: opssquad-test }]
roleRef: { kind: Role, name: runtime-agent, apiGroup: rbac.authorization.k8s.io }
---
# ---- data stores (emptyDir: the namespace is disposable) ----
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: opssquad-test }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: opssquad }
            - { name: POSTGRES_DB, value: opssquad }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: opssquad-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "opssquad"] }, periodSeconds: 3 }
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: opssquad-test }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: opssquad-test }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: opssquad-test }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: batch/v1
kind: Job
metadata: { name: opssquad-migrate, namespace: opssquad-test }
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -e
              until pg_isready -h postgres -U opssquad; do sleep 2; done
              if [ "$(psql "$DATABASE_URL" -tAc "SELECT to_regclass('public.agents') IS NOT NULL")" = t ]; then
                echo "schema already applied"
              else
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /sql/001_init.sql
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /sql/seed.sql
              fi
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: opssquad-secrets, key: DATABASE_URL } }
          volumeMounts: [{ name: sql, mountPath: /sql }]
      volumes: [{ name: sql, configMap: { name: opssquad-sql } }]
---
# ---- the app itself (`:test` tags so the dev namespace's `:local` images are untouched) ----
apiVersion: apps/v1
kind: Deployment
metadata: { name: runtime, namespace: opssquad-test }
spec:
  replicas: 1
  selector: { matchLabels: { app: runtime } }
  template:
    metadata: { labels: { app: runtime } }
    spec:
      serviceAccountName: runtime
      containers:
        - name: runtime
          image: opssquad/runtime:test
          imagePullPolicy: IfNotPresent
          securityContext: { capabilities: { add: ["SYS_ADMIN"] } }  # buildah, same as dev
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: opssquad-config }
            - secretRef: { name: opssquad-secrets }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: runtime, namespace: opssquad-test }
spec: { selector: { app: runtime }, ports: [{ port: 8000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bff, namespace: opssquad-test }
spec:
  replicas: 1
  selector: { matchLabels: { app: bff } }
  template:
    metadata: { labels: { app: bff } }
    spec:
      serviceAccountName: bff
      containers:
        - name: bff
          image: opssquad/bff:test
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: opssquad-config }
            - secretRef: { name: opssquad-secrets }
          readinessProbe: { httpGet: { path: /health, port: 4000 }, initialDelaySeconds: 5, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: bff, namespace: opssquad-test }
spec: { selector: { app: bff }, ports: [{ port: 4000 }] }
---
# ---- tool targets ----
apiVersion: apps/v1
kind: Deployment
metadata: { name: registry, namespace: opssquad-test }
spec:
  replicas: 1
  selector: { matchLabels: { app: registry } }
  template:
    metadata: { labels: { app: registry } }
    spec: { containers: [{ name: registry, image: "registry:2", ports: [{ containerPort: 5000 }] }] }
---
apiVersion: v1
kind: Service
metadata: { name: registry, namespace: opssquad-test }
spec: { selector: { app: registry }, ports: [{ port: 5000 }] }
---
# Mocks for PagerDuty / Slack / Cost Explorer / metrics / alert sink.
# Runs from the runtime image only because it is already loaded into kind.
apiVersion: apps/v1
kind: Deployment
metadata: { name: mocks, namespace: opssquad-test }
spec:
  replicas: 1
  selector: { matchLabels: { app: mocks } }
  template:
    metadata: { labels: { app: mocks } }
    spec:
      containers:
        - name: mocks
          image: opssquad/runtime:test
          imagePullPolicy: IfNotPresent
          command: ["python", "/mock/mocks.py"]
          ports: [{ containerPort: 8080 }]
          volumeMounts: [{ name: src, mountPath: /mock }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 3 }
      volumes: [{ name: src, configMap: { name: mocks-src } }]
---
apiVersion: v1
kind: Service
metadata: { name: mocks, namespace: opssquad-test }
spec: { selector: { app: mocks }, ports: [{ port: 8080 }] }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: opssquad-test }
data:
  prometheus.yml: |
    global: { scrape_interval: 15s, evaluation_interval: 15s }
    rule_files: [/etc/prometheus/rules/*.yml]
    alerting:
      alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
    scrape_configs:
      - job_name: checkout
        static_configs: [{ targets: ["mocks:8080"] }]
  rules.yml: |
    groups:
      - name: opssquad-test
        rules:
          - alert: CheckoutHighErrorRate
            expr: checkout_error_ratio > 0.05
            for: 0m
            labels: { severity: P1, service: checkout }
            annotations: { summary: "checkout error ratio above 5%", pagerduty_incident: PTEST001 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: opssquad-test }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: cfg, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: cfg, mountPath: /etc/prometheus/rules/rules.yml, subPath: rules.yml }
      volumes: [{ name: cfg, configMap: { name: prometheus-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: opssquad-test }
spec: { selector: { app: prometheus }, ports: [{ port: 9090 }] }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: alertmanager-config, namespace: opssquad-test }
data:
  alertmanager.yml: |
    route: { receiver: sink, group_by: [alertname], repeat_interval: 1h }
    receivers:
      - name: sink
        webhook_configs: [{ url: "http://mocks:8080/sink" }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alertmanager, namespace: opssquad-test }
spec:
  replicas: 1
  selector: { matchLabels: { app: alertmanager } }
  template:
    metadata: { labels: { app: alertmanager } }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
          ports: [{ containerPort: 9093 }]
          volumeMounts: [{ name: cfg, mountPath: /etc/alertmanager }]
      volumes: [{ name: cfg, configMap: { name: alertmanager-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: alertmanager, namespace: opssquad-test }
spec: { selector: { app: alertmanager }, ports: [{ port: 9093 }] }
---
# Fixture: a workload that really crash-loops, so "which pod is unhealthy /
# why" has a true answer and restart/scale have something to act on.
apiVersion: apps/v1
kind: Deployment
metadata: { name: crashy, namespace: opssquad-test }
spec:
  replicas: 1
  selector: { matchLabels: { app: crashy } }
  template:
    metadata: { labels: { app: crashy } }
    spec:
      containers:
        - name: crashy
          image: busybox:1.36
          command: ["sh", "-c", "echo 'fatal: cannot open /etc/crashy/config.yaml: no such file' >&2; exit 1"]
