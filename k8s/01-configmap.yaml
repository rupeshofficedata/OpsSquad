apiVersion: v1
kind: ConfigMap
metadata:
  name: opssquad-config
  namespace: opssquad
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  POSTGRES_USER: "opssquad"
  POSTGRES_DB: "opssquad"
  REDIS_URL: "redis://redis:6379"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_TTL: "7d"
  INTENT_ROUTER_MODEL: "claude-haiku-4-5-20251001"
  AGENT_MODEL: "claude-sonnet-5"
  BFF_PORT: "4000"
  RUNTIME_URL: "http://runtime:8000"
  FRONTEND_ORIGIN: "http://localhost:5173"
  MUTATING_AGENTS_ENABLED: "true"
  REAL_TOOLS_ENABLED: "true"
  # 172.18.0.1 is the kind Docker network's gateway — reaches the host
  # machine's llama-server (bound to 0.0.0.0:8080) from inside a pod.
  # `docker network inspect kind` confirms this per-machine; not portable.
  LOCAL_LLM_BASE_URL: "http://172.18.0.1:8080/v1"
  # local-model-control/agent.py — run manually on the host, same bridge
  # path as LOCAL_LLM_BASE_URL above. Backs the Chat page's model status
  # indicator + "Start model" button.
  MODEL_CONTROL_URL: "http://172.18.0.1:8081"
  VAULT_ADDR: "http://vault:8200"
