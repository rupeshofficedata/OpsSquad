# Dev-only defaults, same as .env.example — change every value here before
# using this manifest against anything but a local/throwaway cluster.
apiVersion: v1
kind: Secret
metadata:
  name: opssquad-secrets
  namespace: opssquad
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgresql://opssquad:change-me@postgres:5432/opssquad"
  JWT_SECRET: "change-me-to-a-long-random-string"
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
