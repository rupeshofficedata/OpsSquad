# Dev-only default, same as .env.example — change before using this
# manifest against anything but a local/throwaway cluster.
#
# JWT_SECRET, ANTHROPIC_API_KEY, OPENAI_API_KEY, GITHUB_WEBHOOK_SECRET, and
# ALERTMANAGER_WEBHOOK_TOKEN used to live here too — they now live in Vault
# (see 06-vault.yaml, 07-vault-init-job.yaml), fetched by runtime/bff at
# startup via their own Kubernetes-auth ServiceAccount tokens, not a static
# credential. Postgres itself stays on a plain k8s Secret because it's an
# unmodified postgres:16-alpine image with no way to speak to Vault without
# a sidecar injector — real extra complexity for one credential that's
# already reasonably contained (only Postgres and the two app pods see it).
apiVersion: v1
kind: Secret
metadata:
  name: opssquad-secrets
  namespace: opssquad
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgresql://opssquad:change-me@postgres:5432/opssquad"
