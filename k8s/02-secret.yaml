# Dev-only defaults, same as .env.example — change every value here before
# using this manifest against anything but a local/throwaway cluster.
apiVersion: v1
kind: Secret
metadata:
  name: opssquad-secrets
  namespace: opssquad
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgresql://opssquad:change-me@postgres:5432/opssquad"
  JWT_SECRET: "change-me-to-a-long-random-string"
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GITHUB_WEBHOOK_SECRET: ""
  # Required — the alertmanager webhook rejects every request without a
  # matching bearer token. Point Alertmanager's http_config.authorization at
  # this same value.
  ALERTMANAGER_WEBHOOK_TOKEN: "change-me-alertmanager-token"
