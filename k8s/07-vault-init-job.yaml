# Reconfigures Vault: enables KV v2 + Kubernetes auth, writes the
# least-privilege policies/roles, seeds the actual secret values. A
# CronJob, not a one-shot Job — dev-mode Vault (k8s/06-vault.yaml) is
# in-memory, so ANY restart of the vault pod wipes this config entirely,
# which previously required a human to notice runtime/bff crash-looping
# on a 403 and manually rerun this. Every step here is already `|| true`-
# or overwrite-idempotent, so running it every 2 minutes regardless of
# whether Vault actually restarted is a cheap, safe no-op the rest of the
# time, and self-heals within ~2 minutes of any real restart with zero
# manual intervention. bootstrap.sh still triggers one immediate run for
# first-time setup via `kubectl create job --from=cronjob/...`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: opssquad-vault-init
  namespace: opssquad
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: vault-init
              image: hashicorp/vault:1.18
              env:
                - name: VAULT_ADDR
                  value: "http://vault:8200"
                - name: VAULT_TOKEN
                  valueFrom: { secretKeyRef: { name: opssquad-vault-seed, key: VAULT_ROOT_TOKEN } }
                - name: JWT_SECRET
                  valueFrom: { secretKeyRef: { name: opssquad-vault-seed, key: JWT_SECRET } }
                - name: ANTHROPIC_API_KEY
                  valueFrom: { secretKeyRef: { name: opssquad-vault-seed, key: ANTHROPIC_API_KEY } }
                - name: OPENAI_API_KEY
                  valueFrom: { secretKeyRef: { name: opssquad-vault-seed, key: OPENAI_API_KEY } }
                - name: GITHUB_WEBHOOK_SECRET
                  valueFrom: { secretKeyRef: { name: opssquad-vault-seed, key: GITHUB_WEBHOOK_SECRET } }
                - name: ALERTMANAGER_WEBHOOK_TOKEN
                  valueFrom: { secretKeyRef: { name: opssquad-vault-seed, key: ALERTMANAGER_WEBHOOK_TOKEN } }
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: opssquad-vault-seed, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: opssquad-vault-seed, key: AWS_SECRET_ACCESS_KEY } }
                - name: AWS_REGION
                  valueFrom: { secretKeyRef: { name: opssquad-vault-seed, key: AWS_REGION } }
                - name: SLACK_WEBHOOK_URL
                  valueFrom: { secretKeyRef: { name: opssquad-vault-seed, key: SLACK_WEBHOOK_URL } }
                - name: PAGERDUTY_API_TOKEN
                  valueFrom: { secretKeyRef: { name: opssquad-vault-seed, key: PAGERDUTY_API_TOKEN } }
              command:
                - sh
                - -c
                - |
                  set -e
                  until vault status >/dev/null 2>&1; do sleep 1; done

                  vault secrets enable -path=secret kv-v2 || true
                  vault auth enable kubernetes || true
                  vault write auth/kubernetes/config kubernetes_host=https://kubernetes.default.svc

                  printf 'path "secret/data/opssquad/jwt"     { capabilities = ["read"] }\npath "secret/data/opssquad/llm"      { capabilities = ["read"] }\npath "secret/data/opssquad/webhooks" { capabilities = ["read"] }\npath "secret/data/opssquad/integrations" { capabilities = ["read"] }\n' | vault policy write opssquad-runtime -
                  printf 'path "secret/data/opssquad/jwt" { capabilities = ["read"] }\n' | vault policy write opssquad-bff -

                  vault write auth/kubernetes/role/opssquad-runtime \
                    bound_service_account_names=runtime \
                    bound_service_account_namespaces=opssquad \
                    policies=opssquad-runtime \
                    ttl=1h

                  vault write auth/kubernetes/role/opssquad-bff \
                    bound_service_account_names=bff \
                    bound_service_account_namespaces=opssquad \
                    policies=opssquad-bff \
                    ttl=1h

                  vault kv put secret/opssquad/jwt secret="$JWT_SECRET"
                  vault kv put secret/opssquad/llm anthropic_api_key="$ANTHROPIC_API_KEY" openai_api_key="$OPENAI_API_KEY"
                  vault kv put secret/opssquad/webhooks github_secret="$GITHUB_WEBHOOK_SECRET" alertmanager_token="$ALERTMANAGER_WEBHOOK_TOKEN"
                  vault kv put secret/opssquad/integrations \
                    aws_access_key_id="$AWS_ACCESS_KEY_ID" aws_secret_access_key="$AWS_SECRET_ACCESS_KEY" aws_region="$AWS_REGION" \
                    slack_webhook_url="$SLACK_WEBHOOK_URL" pagerduty_api_token="$PAGERDUTY_API_TOKEN"

                  echo "vault configured"
