apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime
  namespace: opssquad
spec:
  replicas: 1
  selector:
    matchLabels: { app: runtime }
  template:
    metadata:
      labels: { app: runtime }
    spec:
      serviceAccountName: runtime
      containers:
        - name: runtime
          image: opssquad/runtime:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: opssquad-config }
            - secretRef: { name: opssquad-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: runtime
  namespace: opssquad
spec:
  selector: { app: runtime }
  ports:
    - port: 8000
      targetPort: 8000
