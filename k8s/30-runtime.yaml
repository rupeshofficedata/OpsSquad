apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime
  namespace: opssquad
spec:
  replicas: 1
  selector:
    matchLabels: { app: runtime }
  template:
    metadata:
      labels: { app: runtime }
    spec:
      serviceAccountName: runtime
      containers:
        - name: runtime
          image: opssquad/runtime:local
          imagePullPolicy: IfNotPresent
          # Found by testing, not assumed: buildah (the real docker.build/
          # docker.tag target) needs CAP_SYS_ADMIN to create its build
          # namespace even running as root — plain `docker run` with no
          # added capability fails with "unshare(CLONE_NEWUSER): Operation
          # not permitted". One narrow capability, not `privileged: true`.
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
          ports:
            - containerPort: 8000
          env:
            - name: VAULT_ROLE
              value: "opssquad-runtime"
          envFrom:
            - configMapRef: { name: opssquad-config }
            - secretRef: { name: opssquad-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: runtime
  namespace: opssquad
spec:
  selector: { app: runtime }
  ports:
    - port: 8000
      targetPort: 8000
