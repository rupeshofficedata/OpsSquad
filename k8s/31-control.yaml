apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
  namespace: opssquad
spec:
  replicas: 1
  selector:
    matchLabels: { app: control }
  template:
    metadata:
      labels: { app: control }
    spec:
      containers:
        - name: control
          image: opssquad/control:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6001
          envFrom:
            - configMapRef: { name: opssquad-config }
            - secretRef: { name: opssquad-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 6001 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 6001 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: control
  namespace: opssquad
spec:
  selector: { app: control }
  ports:
    - port: 6001
      targetPort: 6001
