# The opssquad-sql ConfigMap referenced here is generated by bootstrap.sh
# from db/migrations/001_init.sql and db/seed.sql, so it always matches the
# checked-in source of truth instead of a copy pasted into this file.
apiVersion: batch/v1
kind: Job
metadata:
  name: opssquad-migrate
  namespace: opssquad
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              set -e
              until pg_isready -h postgres -U "$POSTGRES_USER"; do sleep 2; done
              already=$(psql "$DATABASE_URL" -tAc "SELECT to_regclass('public.agents') IS NOT NULL")
              if [ "$already" = "t" ]; then
                echo "schema already applied — skipping migration and seed"
              else
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /sql/001_init.sql
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /sql/seed.sql
              fi
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: opssquad-config, key: POSTGRES_USER } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: opssquad-secrets, key: DATABASE_URL } }
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap: { name: opssquad-sql }
