# Least-privilege ServiceAccount for the runtime pod's real kubectl tool
# calls — read pods/logs, read+scale+restart deployments, scoped to the
# opssquad namespace only. Matches the README's own stated principle:
# "Every agent gets its own IAM role / kubeconfig — never one god credential."
# secrets/services were added for the real helm.upgrade/rollback target
# (k8s/charts/canary) — Helm stores release state as Secrets, and the
# chart creates one Service. Still opssquad-namespace-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime
  namespace: opssquad
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-agent
  namespace: opssquad
rules:
  # Read-only view for kubectl.get/logs/events/describe.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  # Changes are limited to the two deployments the tools are meant to touch:
  # `redis` (kubectl.scale/restart target) and `canary` (helm release). The
  # runtime cannot scale, restart or delete itself, bff, postgres, etc.
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: ["redis", "canary"]
    verbs: ["get", "patch", "update", "delete"]
  # helm.upgrade/rollback: create is not name-restrictable (the object does not
  # exist yet); release state lives in Secrets named sh.helm.release.v1.canary.*
  # whose revision suffix changes, so those cannot be pinned by name either.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["canary"]
    verbs: ["update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runtime-agent
  namespace: opssquad
subjects:
  - kind: ServiceAccount
    name: runtime
    namespace: opssquad
roleRef:
  kind: Role
  name: runtime-agent
  apiGroup: rbac.authorization.k8s.io
---
# No k8s Role needed — bff never calls kubectl. It exists so Vault's
# Kubernetes auth method (k8s/07-vault-init-job.yaml) can bind a Vault
# policy to this ServiceAccount by name, so bff authenticates to Vault
# with its own projected token instead of holding a static credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bff
  namespace: opssquad
