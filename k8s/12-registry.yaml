# Real registry.push/registry.pull target — a real, self-hosted Docker
# Registry (no auth, no TLS, reachable only inside the cluster). No
# persistence: losing pushed images on a pod restart is fine for this
# demo target, same "safe, self-contained, restartable" principle as the
# Helm canary release.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: opssquad
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: opssquad
spec:
  selector: { app: registry }
  ports:
    - port: 5000
      targetPort: 5000
