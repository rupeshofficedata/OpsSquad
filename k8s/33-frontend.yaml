apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: opssquad
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: opssquad/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            # Browser-facing: the BFF is reached via `kubectl port-forward`
            # to localhost, not via the in-cluster Service DNS name.
            - name: VITE_API_URL
              value: "http://localhost:4000"
          readinessProbe:
            httpGet: { path: /, port: 5173 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: opssquad
spec:
  selector: { app: frontend }
  ports:
    - port: 5173
      targetPort: 5173
