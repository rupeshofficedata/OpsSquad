apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: canary }
  template:
    metadata:
      labels: { app: canary }
    spec:
      containers:
        - name: canary
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
